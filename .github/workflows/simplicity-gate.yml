name: Simplicity Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run smoke test
        run: node bin/simplicity-gate.js eval examples/reformat-json.md

      - name: Run benchmark
        run: npm run bench

  simplicity-gate:
    name: Simplicity Gate Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run Simplicity Gate Scan
        run: |
          node bin/simplicity-gate.js scan .

      - name: Run Simplicity Gate Bench
        run: |
          node bin/simplicity-gate.js bench

  eval-proposals:
    name: Evaluate Proposals
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Find and evaluate proposals
        run: |
          find . -name "*.proposal.md" -o -name "*-proposal.md" -o -name "PROPOSAL*.md" | head -20 | while IFS= read -r file; do
            echo "Evaluating: $file"
            node bin/simplicity-gate.js eval "$file" || true
          done